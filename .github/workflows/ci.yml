name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Address stability + forbidden imports on the committed wasm — no rust
  # build needed; the vendored bytes in ui/contracts/ are the source of truth.
  vendored-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check-addresses
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - run: make check-imports-vendored

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: make test

  # CROSS-ARCH reproducibility gate. This runner is amd64; it rebuilds the four
  # non-frozen contracts + delegate in the pinned Docker image and asserts they
  # match scripts/repro-reference-hashes.txt (pinned on arm64). A pass proves
  # the arm64 dev build and the amd64 CI build produce byte-identical wasm — so
  # identical contract addresses. Does NOT diff the grandfathered vendored
  # addressing bytes, so it never forces a rotation. See docs/reproducible-builds.md.
  docker-repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make verify-repro
