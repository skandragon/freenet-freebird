[package]
name = "inbox-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Freebird per-author reply inbox contract"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["freenet-main-contract"]
freenet-main-contract = []

[dependencies]
serde.workspace = true
ciborium.workspace = true
ed25519-dalek.workspace = true
freenet-stdlib.workspace = true
freenet-scaffold.workspace = true
freebird-core.workspace = true
# ghostkey_lib (via freebird-core) unconditionally pulls `rand`, whose
# getrandom backend on wasm32-unknown-unknown either fails to compile or —
# worse — emits wasm-bindgen placeholder imports wasmtime can't resolve
# (freenet/river#241). The "custom" feature compiles a stub backend; no
# backend is ever registered, and the verification paths call no RNG.
# Do NOT add `rand` or a getrandom backend feature here.
getrandom = { workspace = true, features = ["custom"] }

[dev-dependencies]
freebird-core = { workspace = true, features = ["test-fixtures"] }
rand.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
