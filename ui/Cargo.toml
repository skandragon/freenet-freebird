[package]
name = "freebird-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Freebird web UI (Dioxus)"

[dependencies]
freebird-core = { workspace = true, features = [] }
# Types only — default-features = false keeps the contract entry points out
# of the browser wasm.
directory-contract = { path = "../contracts/directory-contract", default-features = false }
freenet-stdlib = { workspace = true, features = ["net"] }
freenet-scaffold.workspace = true
ghostkey_lib.workspace = true
ciborium.workspace = true
serde.workspace = true
serde_json = "1"
bs58.workspace = true
base64.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand.workspace = true
# Browser build: the js backend is fine here (and only here) — the UI runs
# in a real browser, not wasmtime. See freenet/river#241.
getrandom = { workspace = true, features = ["js"] }

dioxus = { version = "0.7", features = ["web"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
futures = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "Location",
    "Storage",
    "UrlSearchParams",
    "WebSocket",
    "MessageEvent",
    "Response",
    "console",
    "Navigator",
    "Clipboard",
    "HtmlImageElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
] }
