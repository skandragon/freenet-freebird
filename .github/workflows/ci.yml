name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Address stability + forbidden imports on the committed wasm — no rust
  # build needed; the vendored bytes in ui/contracts/ are the source of truth.
  vendored-wasm:
    runs-on: ubuntu-latest
    steps:
      # check-legacy-wasm reads the live build's blobs out of git history, so
      # the default shallow clone is not enough.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make check-addresses
      - run: make check-legacy-wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - run: make check-imports-vendored

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: make test

  # Reproducibility gate. This runner is amd64 — the single build-of-record
  # arch (wasm bytes are NOT identical across host arch; an arm64 build of the
  # same source differs). It rebuilds the four non-frozen contracts + delegate
  # in the pinned Docker image and asserts they match
  # scripts/repro-reference-hashes.txt (canonical amd64 hashes of the current
  # source). Does NOT diff the grandfathered vendored addressing bytes, so it
  # never forces a rotation. See docs/reproducible-builds.md.
  docker-repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make verify-repro
