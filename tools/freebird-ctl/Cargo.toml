[package]
name = "freebird-ctl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Freebird publisher CLI: mint the publisher key, publish/show the control cell"

[dependencies]
cell-contract = { path = "../../contracts/cell-contract", default-features = false }
freebird-control = { path = "../../control" }
freenet-stdlib = { workspace = true, features = ["net"] }
ciborium.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand.workspace = true
data-encoding.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite = "0.27"
